name: Security - Secrets & Dependency Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          install_dir="${RUNNER_TEMP}/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          mkdir -p "${install_dir}"
          cd "${install_dir}"
          curl --fail --location --show-error --silent "${base_url}/${archive}" --output "${archive}"
          curl --fail --location --show-error --silent "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output gitleaks_checksums.txt
          sha256sum --check --ignore-missing gitleaks_checksums.txt

          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks git "${GITHUB_WORKSPACE}" --redact --verbose

  osv:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install script dependencies
        run: pnpm install --frozen-lockfile

      - name: Test SwiftPM OSV audit
        run: pnpm --filter mcpsafari-scripts exec vitest run test/audit-swiftpm-osv.test.ts

      - name: Run SwiftPM OSV audit
        run: node scripts/src/audit-swiftpm-osv.ts MCPServer/Package.resolved
