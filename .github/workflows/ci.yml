name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# Building and testing needs nothing but the source. Stated per workflow rather
# than left to the repository default, so widening that default later cannot
# quietly widen this.
permissions:
  contents: read

# A newer push to a pull request makes the earlier run moot. Pushes to main are
# never cancelled, so every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail

          for app in /Applications/Xcode_26.6.app /Applications/Xcode_26.6.0.app /Applications/Xcode.app; do
            if [ -d "$app/Contents/Developer" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done

          xcodebuild -version
          swift --version
          swift --version | grep -q "Apple Swift version 6.3" || {
            echo "::error::Swift 6.3 is required to build MCPServer"
            exit 1
          }

      # Pinned rather than taken from whatever the runner image ships, so a
      # runner image update cannot change the Node the extension tests run on.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript tooling
        run: pnpm install --frozen-lockfile

      - name: Build MCP Server
        run: |
          cd MCPServer
          swift build --force-resolved-versions

      - name: Test MCP Server
        run: |
          cd MCPServer
          swift test --force-resolved-versions

      # Formatting, lint and typechecking across the workspace; the extension's
      # bundle build and tests, which run against the bundles exactly as Safari
      # loads them; and the release and audit script tests.
      - name: Check TypeScript
        run: pnpm check

      # Against the debug server built above.
      - name: Test MCP tool result contracts
        run: pnpm test:mcp

      - name: Test MCP handshake and bridge status
        run: |
          swift build --package-path MCPServer --force-resolved-versions -c release
          node scripts/src/smoke-mcp.ts MCPServer/.build/release/MCPSafari

      - name: Build Safari Extension
        run: |
          cd MCPSafari
          xcodebuild -project MCPSafari.xcodeproj \
            -scheme "MCPSafari" \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      # The extension's token reader is the only path a token takes to Safari,
      # and every way it can fail is silent, so its unit tests run here too.
      - name: Test Safari Extension token reader
        run: |
          cd MCPSafari
          xcodebuild test -project MCPSafari.xcodeproj \
            -scheme "MCPSafari" \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
